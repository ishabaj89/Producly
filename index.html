<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productly</title>

    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <span class="logo-shape"></span>
            <span>Productly</span>
        </div>

        <nav class="navigation">
            <a href="#">Product</a>
            <a href="#">Customers</a>
            <a href="#">Pricing</a>
            <a href="#">Resources</a>
        </nav>

        <div class="header-buttons">
            <button class="sign-in">Sign In</button>
            <button class="sign-up">Sign Up</button>
        </div>

    </header>


    <!-- Main content -->
    <main class="main-content">

        <section class="intro">

            <!-- Text -->
            <div class="intro-text">

                <h1>
                    The Design Thinking<br>
                    superpowers
                </h1>

                <p>
                    Tools, tutorials, design and innovation experts, all
                    in one place! The most intuitive way to imagine
                    your next user experience.
                </p>

                <div class="intro-buttons">

                    <button class="get-started">
                        Get started
                    </button>

                    <a href="#" class="watch-video">
                        <span class="play">▶</span>
                        Watch the Video
                    </a>

                </div>

            </div>


            <!-- Image -->
            <div class="intro-image">

                <img
                    src="style/photo/image.png"
                    alt="Design"
                >

            </div>

        </section>

    </main>

</body>

</html>
